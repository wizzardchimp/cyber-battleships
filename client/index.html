<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050b18" />
    <title>Cyber Battleships</title>
    <link rel="icon" href="/brand/logo-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/logo-180.png" />
    <link rel="preload" href="/brand/mark-128.png" as="image" />
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="landing-page">
    <div class="scanlines" aria-hidden="true"></div>
    <div id="app">
      <main class="landing">
        <header class="landing__hero">
          <img class="landing__logo" src="/brand/mark-256.png" alt="Cyber Battleships logo" />
          <p class="eyebrow"><span class="status-dot"></span> Live cyber defence training</p>
          <h1 class="landing__title">
            <span>CYBER</span>
            <span class="landing__title-accent">BATTLESHIPS</span>
          </h1>
          <p class="landing__copy">Answer questions. Earn missiles. Sink the other fleet.</p>
        </header>

        <section class="landing__card panel hud">
          <h2 class="landing__card-title">FACILITATOR</h2>
          <p class="landing__hint landing__hint--lead">
            Start a game on this screen. A QR code appears for players to scan with their phones.
          </p>
          <a id="start-game" class="btn btn--primary btn--wide" href="/display">START GAME</a>
        </section>

        <details class="landing__player">
          <summary>Joining as a player? Enter a code</summary>
          <form id="join-form" class="landing__form" novalidate>
            <label class="field">
              <span class="field__label">Join code</span>
              <input
                id="join-code"
                class="input input--code"
                name="code"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="6"
                placeholder="ABC123"
                required
              />
            </label>
            <button class="btn btn--wide" type="submit">JOIN</button>
            <p id="join-error" class="form-error" role="alert"></p>
          </form>
        </details>
      </main>
    </div>
    <script type="module" src="/src/landing/main.js"></script>
  </body>
</html>
