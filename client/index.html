<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050b18" />
    <meta name="description" content="Cyber Battleships — a live multiplayer cyber security training game." />
    <title>Cyber Battleships // Live Operations</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/share-tech-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="landing-page">
    <div class="scanlines" aria-hidden="true"></div>
    <div id="app">
      <main class="landing">
        <section class="landing__hero">
          <p class="eyebrow"><span class="status-dot"></span> Live cyber defence training</p>
          <h1 class="hero-title">
            <span>CYBER</span>
            <span class="hero-title--accent">BATTLESHIPS</span>
          </h1>
          <p class="hero-copy">
            Answer. Earn missiles. Sink the opposition. A real-time cyber security
            competition for classrooms, workshops and teams.
          </p>
        </section>

        <section class="landing__panel panel">
          <h2 class="panel__title">JOIN AN OPERATION</h2>
          <form id="join-form" class="stack" novalidate>
            <label class="field">
              <span class="field__label">Join code</span>
              <input
                id="join-code"
                class="input input--code"
                name="code"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="6"
                placeholder="ABC123"
                required
              />
            </label>
            <button class="btn btn--primary btn--wide" type="submit">ENTER THE BATTLE</button>
            <p id="join-error" class="form-error" role="alert"></p>
          </form>
          <p class="landing__hint">Scan the QR code on the projector, or enter the six-character code.</p>
        </section>

        <footer class="landing__footer">
          <a href="/host">Facilitator console</a>
          <span>//</span>
          <a href="/display">Projector display</a>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/landing/main.js"></script>
  </body>
</html>
