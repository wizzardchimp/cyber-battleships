<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b18" />
    <meta name="robots" content="noindex" />
    <title>Game Screen // Cyber Battleships</title>
    <link rel="icon" href="/brand/logo-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/logo-180.png" />
    <link rel="preload" href="/brand/mark-128.png" as="image" />
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/share-tech-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="display-page">
    <div class="scanlines" aria-hidden="true"></div>
    <div id="app" class="display-app">
      <div class="boot-screen">
        <img class="boot-screen__mark" src="/brand/mark-256.png" alt="" />
        <div class="boot-screen__logo">CYBER BATTLESHIPS</div>
        <div class="boot-screen__bar"><span></span></div>
        <p>Connecting to the game…</p>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root toast-root--display" aria-live="polite"></div>
    <script type="module" src="/src/display/main.js"></script>
  </body>
</html>
