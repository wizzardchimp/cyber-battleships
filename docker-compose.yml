services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: battleships
      POSTGRES_USER: battleships
      POSTGRES_PASSWORD: battleships
    ports:
      - "5432:5432"
    volumes:
      - battleships-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleships -d battleships"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://battleships:battleships@db:5432/battleships
      PGSSL: "false"
    ports:
      - "3000:3000"

volumes:
  battleships-db:
